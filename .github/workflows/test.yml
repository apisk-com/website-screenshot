# Tests the tutorial folders on Linux.
#
# Each tutorial folder that has a test.sh is one test job. test.sh installs
# what the folder needs (npm packages, browsers, system libraries, Docker
# images) and exits with a non-zero code if a check fails.
#
# - push to main: tests the folders that the push changed (all folders if
#   this workflow changed).
# - pull request: tests the folders that the pull request changes.
# - manual run: tests one folder (input "folder") or all folders.
name: Test tutorials

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      folder:
        description: Tutorial folder to test (empty = all folders)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      folders: ${{ steps.pick.outputs.folders }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the folders to test
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FOLDER: ${{ inputs.folder }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          all=$(for d in */; do d=${d%/}; if [ -f "$d/test.sh" ]; then echo "$d"; fi; done)
          changed_folders() {
            changed=$(git diff --name-only "$1" HEAD | cut -d/ -f1 | sort -u)
            if echo "$changed" | grep -qx '.github'; then
              echo "$all"
            else
              comm -12 <(echo "$all" | sort) <(echo "$changed" | sort)
            fi
          }
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT_FOLDER" ]; then list="$INPUT_FOLDER"; else list="$all"; fi
          elif [ "$EVENT" = pull_request ]; then
            list=$(changed_folders "$BASE")
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            list=$(changed_folders "$BEFORE")
          else
            list="$all"
          fi
          json=$(printf '%s\n' $list | jq -R . | jq -sc 'map(select(length > 0))')
          echo "folders=$json" >> "$GITHUB_OUTPUT"
          echo "Folders to test: $json"

  test:
    needs: list
    if: needs.list.outputs.folders != '[]'
    name: ${{ matrix.folder }}
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.list.outputs.folders) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Ubuntu 23.10 and later block the user namespaces that the Chrome
      # sandbox uses. Most servers and Docker hosts allow them, so the tests
      # do the same.
      - name: Allow unprivileged user namespaces for the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test ${{ matrix.folder }}
        working-directory: ${{ matrix.folder }}
        run: bash test.sh
